[package]
name = "termd"
version = "0.1.0"
edition = "2021"
description = "Relay Terminal PTY host (R1): drop-in replacement for relayd's TypeScript PTY host"
license = "MIT"

[lib]
name = "termd"
path = "src/lib.rs"

[[bin]]
name = "termd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws", "json", "query"] }
portable-pty = "0.9"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.26"
tempfile = "3"
