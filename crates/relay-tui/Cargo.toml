[package]
name = "relay-tui"
version = "0.1.0"
edition = "2021"
description = "Relay Terminal client (R2): Ratatui TUI for relayd — mission tree, explainable graph, live agent panes, inbox, inspector"
license = "MIT"

[lib]
name = "relay_tui"
path = "src/lib.rs"

[[bin]]
name = "relay-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-term = "0.3"
vt100 = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"

[dev-dependencies]
axum = { version = "0.8", features = ["ws", "json", "query"] }
tempfile = "3"
