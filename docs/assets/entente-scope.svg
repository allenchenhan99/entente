<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Entente: Provenance Engineering for Agent Teams</title><desc id="desc">Six nested scopes. Prompt is inside Context, Harness, Loop, Graph, and the outermost Provenance Engineering scope proposed by Entente.</desc>
<rect width="1200" height="530" rx="20" fill="#0d0d13"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="46" y="67" fill="#b8a0d4" font-size="14" letter-spacing="2">ENTENTE / OUR SCOPE MODEL</text>
<text x="46" y="126" fill="#f0eaf7" font-size="37" font-weight="600">Beyond a single agent.</text>
<text x="46" y="173" fill="#c5a2f0" font-size="37" font-weight="600">Across the delivery chain.</text>
<text x="46" y="240" fill="#b4a8bf" font-size="18">Where did this result come from?</text>
<text x="46" y="273" fill="#b4a8bf" font-size="18">Which version does it belong to?</text>
<text x="46" y="306" fill="#b4a8bf" font-size="18">What evidence supports it?</text>
<text x="46" y="448" fill="#92849f" font-size="14">Scope grows outward. The layers accumulate.</text>
