name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh -n install.sh
      - run: node --test scripts/install.test.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - name: demo app
        run: cd demo-repo && npm ci && npx vitest run && npx tsc --noEmit
      - name: protocol docs are up to date
        run: node scripts/gen-protocol-docs.mjs && git diff --exit-code -- docs/protocol.md docs/schema
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
